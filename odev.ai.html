:["1 This city is full of cool sights! · 2 I need to pop to the bakery! · 3 Let’s catch the funicular! · 4 It’s a must-see in Paris, · 5 What a traffic jam!"]},{"no":"p","soru":"Yeni bir şehirde yaptığın etkinlikleri işaretle","cevap":"Kişisel tercih etkinliği; doğru-yanlış cevabı yok.","adimlar":["Kendi alışkanlıklarına göre işaretle."]},{"no":"q","soru":"Örnek diyaloğu model alıp yeni bir şehirle diyalog yaz (örnek)","cevap":"Mia: Are you ready to explore Rome? Leo: Of course. This city is full of cool sights! Mia: Let’s start with the Colosseum. It’s a must-see in Rome! Leo: Great, but first I need to pop to the bakery. I’m hungry. Mia: Okay. Then we can catch the bus to the city centre and take some photographs. Leo: Good idea. After that, let’s try local food at a café.","adimlar":["Açık uçlu: bir şehir, yerler, ulaşım, 3–4 etkinlik ve o diyalogdaki ifadeler olmalı."]}]},"10-ingilizce-stepwise-calisma-kitabi/26":{"sorular":[{"no":"p","soru":"Diyaloğu deyimlerle tamamla (bir deyim fazla)","cevap":"1 a (At last, you’re here in the flesh) · 2 c (bad books) · 3 d (fit as a fiddle) · 4 b (Let’s break a leg)  (e, feeling in the pink fazla)","adimlar":[]},{"no":"q","soru":"Deyimleri anlamlarıyla eşleştir (bir tanesi fazla)","cevap":"1 be in someone’s bad books → c (be angry with someone) · 2 feeling in the pink → a (feel healthy and happy) · 3 Let’s break a leg → d (wish someone good luck) · 4 At last, you’re here in the flesh → b (see someone in person)  (fit as a fiddle fazla)","adimlar":[]},{"no":"r","soru":"5–6 satırlık diyalog yaz (örnek)","cevap":"Anna: Hi, Ben! At last, you’re here in the flesh! Ben: Sorry, Anna. I’m in my sister’s bad books because I forgot her birthday. Anna: Oh no! How are you feeling today? Ben: I’m feeling in the pink, thanks. We are meeting our friends at the cinema tonight. Anna: Great! Let’s break a leg at the school concert tomorrow, too.","adimlar":["Açık uçlu: bir arkadaşla buluşma, iki deyim, bir plan ve birinin nasıl hissettiği olm function slug(t){
  var m={"ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","Ç":"c","Ğ":"g","İ":"i","Ö":"o","Ş":"s","Ü":"u"};
  return t.split("").map(function(c){return m[c]||c;}).join("").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
// Bu önizlemede cevaplar sayfanın içine gömülü; GitHub sürümünde veri/ klasöründen okunur.
function cevaplariGetir(sinif,ders,sayfa){
  return new Promise(function(resolve){
    var k=sinif+"-"+slug(ders)+"/"+sayfa;
    setTimeout(function(){resolve(VERI[k]||{sorular:[],hata:"Bu sayfa henüz sistemde yok."});},300);
  });
}

var btn=document.getElementById("btn"),sonuc=document.getElementById("sonuc");
btn.addEventListener("click",function(){
  var s=document.getElementById("sayfa").value;
  if(!s||Number(s)<1){sonuc.textContent="Lütfen geçerli bir sayfa numarası gir.";return;}
  btn.disabled=true;sonuc.textContent="Cevaplar getiriliyor…";
  cevaplariGetir(sinif.value,document.getElementById("ders").value,s).then(function(r){
    btn.disabled=false;
    if(r.hata||!r.sorular.length){sonuc.textContent=r.hata||"Bu sayfada soru bulunamadı.";return;}
    sonuc.textContent="";
    var h=document.createElement("div");h.className="head";
    h.textContent=sinif.value+". sınıf · "+document.getElementById("ders").value+" · Sayfa "+s;
    sonuc.appendChild(h);
    r.sorular.forEach(function(q){
      var d=document.createElement("div");d.className="q";
      var t=document.createElement("div");t.className="qt";
      var b=document.createElement("b");b.textContent=q.no+". ";
      t.appendChild(b);t.appendChild(document.createTextNode(q.soru));
      var a=document.createElement("div");a.className="ans";
      var lb=document.createElement("span");lb.className="lbl";lb.textContent="Cevap";a.appendChild(lb);
      String(q.cevap).split(/ · |   \|   /).forEach(function(x){var ap=document.createElement("div");ap.className="ap";ap.textContent=x;a.appendChild(ap);});
      var det=document.createElement("details");
      var sm=document.createElement("summary");sm.textContent="Açıklamayı göster";
      var ol=document.createElement("ol");
      q.adimlar.forEach(function(x){var li=document.createElement("li");li.textContent=x;ol.appendChild(li);});
      det.appendChild(sm);det.appendChild(ol);
      d.appendChild(t);d.appendChild(a);if(q.adimlar&&q.adimlar.length){d.appendChild(det);}sonuc.appendChild(d);
    });
    if(r.demo){var n=document.createElement("div");n.className="demo";n.textContent="Bu sayfa örnektir, kitaptaki gerçek sorular değil.";sonuc.appendChild(n);}
  });
});

// iPhone'da Safari'den açıldıysa "Ana Ekrana Ekle" ipucunu göster
(function(){
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone=window.navigator.standalone===true||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches);
  var tip=document.getElementById("ipucu");
  var kapali=false;try{kapali=localStorage.getItem("ipucuKapali")==="1";}catch(e){}
  if(ios&&!standalone&&!kapali){tip.hidden=false;}
  document.getElementById("ipucuKapat").addEventListener("click",function(){
    tip.hidden=true;try{localStorage.setItem("ipucuKapali","1");}catch(e){}
  });
})();
