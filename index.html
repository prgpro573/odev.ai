<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>odev.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fffcf5;--panel:#ffe9c7;--sun:#ffc21a;--coral:#f2563a;--ink:#3a1f14;--muted:#8a6a58;--line:#f0d7b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Figtree,system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
.logo{font:700 1.6rem "Familjen Grotesk",sans-serif;letter-spacing:-.02em}
.logo span{background:var(--sun);padding:0 .22em;border-radius:3px;margin-left:1px}
.grid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:40px;margin-top:44px;align-items:start}
h1{font:700 clamp(2.1rem,5vw,3.2rem)/1.08 "Familjen Grotesk",sans-serif;letter-spacing:-.03em;margin:0 0 14px}
.lead{color:var(--muted);margin:0 0 26px;max-width:36ch}
form{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;box-shadow:6px 6px 0 var(--coral)}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
.full{grid-column:1/-1}
select,input[type=number],input[type=text]{font:inherit;font-weight:400;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.seg label{flex-direction:row;font-weight:500;margin:0;position:relative}
.seg input{position:absolute;opacity:0}
.seg span{flex:1;text-align:center;padding:9px 6px;cursor:pointer}
.seg input:checked+span{background:var(--ink);color:var(--bg);font-weight:700}
.seg input:focus-visible+span{outline:3px solid var(--coral);outline-offset:-3px}
button.go{font:700 1.05rem "Familjen Grotesk",sans-serif;padding:13px;border:2px solid var(--ink);border-radius:8px;background:var(--sun);color:var(--ink);cursor:pointer}
button.go:hover:not(:disabled){background:#ffd24d}
button.go:disabled{opacity:.6;cursor:wait}
#res{min-height:200px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:28px;color:var(--muted)}
.sol{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 26px}
.sol p{margin:1em 0;max-width:68ch}
.sol strong{font-weight:700;background:linear-gradient(transparent 55%,var(--sun) 55%)}
.bar{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--muted);font-size:.85rem}
.link{background:none;border:0;padding:0;font:inherit;color:var(--coral);text-decoration:underline;cursor:pointer}
.err{color:#b3261e;font-weight:500}
@media (max-width:820px){.grid{grid-template-columns:1fr;gap:28px;margin-top:28px}}
@media (max-width:420px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">odev<span>.ai</span></div>
  <div class="grid">
    <div>
      <h1>Kitabı seç, sayfayı yaz, mantığını gör.</h1>
      <p class="lead">Cevabı kopyalamak için değil, nasıl çözüldüğünü anlamak için.</p>
      <form id="f">
        <label class="full">Ders kitabı<select id="book" required></select></label>
        <label>Sayfa<input id="page" type="number" min="1" inputmode="numeric" required></label>
        <label>Soru no<input id="q" type="text" inputmode="numeric" placeholder="boşsa hepsi"></label>
        <div class="full seg" role="radiogroup" aria-label="Çözüm türü">
          <label><input type="radio" name="mode" value="hint" checked><span>İpucu ver</span></label>
          <label><input type="radio" name="mode" value="full"><span>Tam çözüm</span></label>
        </div>
        <button class="go full" id="go">Çözümü getir</button>
      </form>
    </div>
    <div>
      <section id="res" aria-live="polite"><div class="empty">Çözüm burada görünecek. Önce soruyu kendin dene, takılırsan ipucu iste.</div></section>
      <div class="bar" id="bar" hidden><span id="meta"></span><button type="button" class="link" id="report">Çözüm yanlış görünüyor</button></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
let lastKey=null;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const render=t=>'<div class="sol">'+t.split(/\n{2,}/).map(p=>"<p>"+esc(p).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>")+"</p>").join("")+"</div>";
fetch("/api/books").then(r=>r.json()).then(b=>{$("#book").innerHTML=b.map(x=>`<option value="${x.id}">${x.ad}</option>`).join("")});
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();
  const go=$("#go"),res=$("#res");
  go.disabled=true;go.textContent="Çözülüyor…";$("#bar").hidden=true;
  res.innerHTML='<div class="empty">Sayfa okunuyor, birkaç saniye sürebilir.</div>';
  try{
    const r=await fetch("/api/solve",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({bookId:$("#book").value,page:$("#page").value,question:$("#q").value,
        mode:document.querySelector("input[name=mode]:checked").value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error);
    lastKey=d.key;res.innerHTML=render(d.text);
    $("#meta").textContent=d.cached?"Daha önce çözülmüş sayfa":"Yeni çözüldü";$("#bar").hidden=false;
  }catch(err){res.innerHTML=`<div class="empty err">${esc(err.message||"Bir hata oluştu.")}</div>`}
  go.disabled=false;go.textContent="Çözümü getir";
});
$("#report").onclick=async()=>{
  await fetch("/api/report",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:lastKey})});
  $("#meta").textContent="İşaretlendi, bir sonraki istekte yeniden çözülecek.";
};
</script>
</body>
</html>
