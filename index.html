<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>odev.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fffcf5;--panel:#ffe9c7;--sun:#ffc21a;--coral:#f2563a;--ink:#3a1f14;--muted:#8a6a58;--line:#f0d7b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Figtree,system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(60px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.logo{font:700 1.6rem "Familjen Grotesk",sans-serif;letter-spacing:-.02em}
.logo span{background:var(--sun);padding:0 .22em;border-radius:3px;margin-left:1px}
.grid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:40px;margin-top:44px;align-items:start}
h1{font:700 clamp(2.1rem,5vw,3.2rem)/1.08 "Familjen Grotesk",sans-serif;letter-spacing:-.03em;margin:0 0 14px}
.lead{color:var(--muted);margin:0 0 26px;max-width:36ch}
form{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;box-shadow:6px 6px 0 var(--coral)}
label,.field{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
.cap{font-weight:700;font-size:.9rem}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chips button{font:500 1rem Figtree,system-ui,sans-serif;min-height:48px;padding:12px 8px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:700}
.dd{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font:inherit;font-weight:400;min-height:48px;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.dd.empty #ddTxt{color:var(--muted)}
.ddlist{border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.ddlist button{display:block;width:100%;text-align:left;font:inherit;font-weight:400;min-height:48px;padding:13px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.ddlist button:last-child{border-bottom:0}
.ddlist button[aria-selected=true]{background:var(--sun);font-weight:700}
.ddlist .nobook{padding:13px 12px}
.nobook{grid-column:1/-1;color:var(--muted);font-weight:400}
.chips label{position:relative;flex-direction:row;font-weight:500}
.chips input{position:absolute;opacity:0}
.chips span{flex:1;text-align:center;padding:12px 8px;min-height:48px;border:2px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer}
.chips input:checked+span{background:var(--ink);color:var(--bg);font-weight:700}
.chips input:focus-visible+span{outline:3px solid var(--coral);outline-offset:2px}
.seg.classes{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.full{grid-column:1/-1}
select,input[type=number],input[type=text]{font:inherit;font-weight:400;min-height:48px;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.seg label{flex-direction:row;font-weight:500;margin:0;position:relative}
.seg input{position:absolute;opacity:0}
.seg span{flex:1;text-align:center;padding:12px 6px;min-height:48px;cursor:pointer}
.seg input:checked+span{background:var(--ink);color:var(--bg);font-weight:700}
.seg input:focus-visible+span{outline:3px solid var(--coral);outline-offset:-3px}
button.go{font:700 1.1rem "Familjen Grotesk",sans-serif;min-height:54px;padding:13px;border:2px solid var(--ink);border-radius:8px;background:var(--sun);color:var(--ink);cursor:pointer}
button.go:hover:not(:disabled){background:#ffd24d}
button.go:disabled{opacity:.6;cursor:wait}
#res{min-height:200px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:28px;color:var(--muted)}
.sol{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 26px}
.sol p{margin:1em 0;max-width:68ch}
.sol strong{font-weight:700;background:linear-gradient(transparent 55%,var(--sun) 55%)}
.bar{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--muted);font-size:.85rem}
.link{background:none;border:0;padding:0;font:inherit;color:var(--coral);text-decoration:underline;cursor:pointer}
.q{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.qh{font-size:.95rem;color:var(--muted)}.qh b{color:var(--ink)}
.ans{margin:8px 0 12px;font-size:1.1rem}
.ans strong{background:linear-gradient(transparent 55%,var(--sun) 55%)}
.xbtn{font:700 .95rem "Familjen Grotesk",sans-serif;min-height:44px;padding:8px 14px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
.xbtn[aria-expanded=true]{background:var(--ink);color:var(--bg)}
.exp{margin-top:12px;padding-top:6px;border-top:2px dashed var(--line)}
.exp p{margin:.7em 0}
.err{color:#b3261e;font-weight:500}
@media (max-width:820px){.grid{grid-template-columns:1fr;gap:24px;margin-top:22px}h1{font-size:2rem}.lead{margin-bottom:20px}}
@media (max-width:520px){body{font-size:16px}form{padding:16px;gap:12px;box-shadow:4px 4px 0 var(--coral)}.sol{padding:2px 18px}.empty{padding:20px}.bar{flex-direction:column;gap:6px}#res{min-height:0}}
@media (max-width:340px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">odev<span>.ai</span></div>
  <div class="grid">
    <div>
      <h1>Kitabı seç, sayfayı yaz, mantığını gör.</h1>
      <p class="lead">Sayfadaki bütün soruların cevabı gelir. Nasıl çözüldüğünü görmek için her cevabın altındaki düğmeye dokun.</p>
      <form id="f">
        <label class="full">1. Sınıf<input id="sinif" type="number" min="1" max="12" inputmode="numeric" placeholder="örn. 10" required></label>
        <div class="full field"><span class="cap" id="dl">2. Ders seç</span>
          <button type="button" class="dd empty" id="ddBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="ddList" aria-labelledby="dl ddTxt"><span id="ddTxt">Ders seç</span><span aria-hidden="true">▾</span></button>
          <div class="ddlist" id="ddList" role="listbox" aria-labelledby="dl" hidden></div></div>
        <label class="full">3. Sayfa no<input id="page" type="number" min="1" inputmode="numeric" placeholder="örn. 45" required></label>
        <button class="go full" id="go">Çözümü getir</button>
      </form>
    </div>
    <div>
      <section id="res" aria-live="polite"><div class="empty">Sayfa numarasını yaz, o sayfadaki bütün soruların cevapları burada çıksın.</div></section>
      <div class="bar" id="bar" hidden><span id="meta"></span><button type="button" class="link" id="report">Çözüm yanlış görünüyor</button></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
let lastReq=null;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=t=>String(t).split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p)+"</p>").join("");
const render=items=>items.length?items.map((it,i)=>`<article class="q"><div class="qh"><b>${esc(String(it.no||i+1))}.</b> ${esc(String(it.soru||""))}</div><p class="ans">Cevap: <strong>${esc(String(it.cevap||""))}</strong></p><button type="button" class="xbtn" aria-expanded="false" aria-controls="e${i}">Açıklamayı göster</button><div class="exp" id="e${i}" hidden>${fmt(it.aciklama||"")}</div></article>`).join(""):'<div class="empty">Bu sayfada soru yok.</div>';
document.addEventListener("click",e=>{const b=e.target.closest(".xbtn");if(!b)return;const x=document.getElementById(b.getAttribute("aria-controls")),o=x.hidden;x.hidden=!o;b.setAttribute("aria-expanded",String(o));b.textContent=o?"Açıklamayı gizle":"Açıklamayı göster"});
let BOOKS=[],DERS=null,LIST=[];
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
function showBooks(){
  const s=$("#sinif").value.trim();
  LIST=BOOKS.filter(x=>String(x.sinif)===s);
  if(!LIST.some(x=>x.id===DERS)){const last=store.get("book");DERS=LIST.some(x=>x.id===last)?last:null}
  paint();
}
function paint(){
  const cur=LIST.find(x=>x.id===DERS),s=$("#sinif").value.trim();
  $("#ddTxt").textContent=cur?cur.ders:"Ders seç";
  $("#ddBtn").classList.toggle("empty",!cur);
  $("#ddList").innerHTML=LIST.length?LIST.map(x=>`<button type="button" role="option" data-id="${x.id}" aria-selected="${x.id===DERS}">${x.ders}</button>`).join(""):`<div class="nobook">${s?"Bu sınıf için kitap yok.":"Önce sınıfını yaz."}</div>`;
}
function openDD(o){$("#ddList").hidden=!o;$("#ddBtn").setAttribute("aria-expanded",String(o))}
$("#ddBtn").addEventListener("click",()=>openDD($("#ddList").hidden));
$("#ddList").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;DERS=b.dataset.id;store.set("book",DERS);paint();openDD(false)});
$("#sinif").addEventListener("input",()=>{store.set("sinif",$("#sinif").value);showBooks()});
fetch("/api/books").then(r=>r.json()).then(b=>{BOOKS=b;const sv=store.get("sinif");if(sv)$("#sinif").value=sv;showBooks()});
showBooks();
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!DERS){$("#res").innerHTML='<div class="empty err">Önce sınıfını yaz, sonra ders kutusuna dokunup dersini seç.</div>';return}
  const go=$("#go"),res=$("#res");
  go.disabled=true;go.textContent="Çözülüyor…";$("#bar").hidden=true;
  res.innerHTML='<div class="empty">Sayfa okunuyor, birkaç saniye sürebilir.</div>';
  try{
    const r=await fetch("/api/solve",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({bookId:DERS,page:$("#page").value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error);
    lastReq={bookId:DERS,page:Number($("#page").value)};res.innerHTML=render(d.items);
    $("#meta").textContent="Hazır çözüm";$("#bar").hidden=false;res.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"});
  }catch(err){res.innerHTML=`<div class="empty err">${esc(err.message||"Bir hata oluştu.")}</div>`}
  go.disabled=false;go.textContent="Çözümü getir";
});
$("#report").onclick=async()=>{
  await fetch("/api/report",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(lastReq)});
  $("#meta").textContent="İşaretlendi, bir sonraki istekte yeniden çözülecek.";
};
</script>
</body>
</html>
