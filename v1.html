<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>odev.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Literata:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbfdff;--grid:#d3e3f0;--ink:#1f3a93;--pen:#d7263d;--text:#1b2430;--muted:#5d6b7c;--line:#b9cde0}
@media (prefers-color-scheme:dark){:root{--paper:#121a26;--grid:#1d2a3b;--ink:#8fb0ff;--pen:#ff6b7d;--text:#e7edf5;--muted:#93a3b8;--line:#2b3c52}}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:17px/1.65 Literata,Georgia,serif;background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
main{max-width:720px;margin:0 auto;padding:40px 20px 80px 56px;position:relative}
main::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:2px;background:var(--pen);opacity:.55}
h1{font:700 clamp(2rem,6vw,3rem)/1.1 "Bricolage Grotesque",sans-serif;color:var(--ink);margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--paper);border:2px solid var(--ink);padding:20px;border-radius:4px}
label{display:flex;flex-direction:column;font:500 .9rem "Bricolage Grotesque",sans-serif;gap:4px}
.full{grid-column:1/-1}
select,input{font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:3px;background:var(--paper);color:var(--text)}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.modes{display:flex;gap:18px;flex-direction:row;align-items:center}
.modes label{flex-direction:row;align-items:center;gap:6px;font-weight:500}
button{font:700 1rem "Bricolage Grotesque",sans-serif;padding:12px 18px;border:0;border-radius:3px;background:var(--ink);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#out{margin-top:28px;background:var(--paper);border:1.5px solid var(--line);padding:6px 22px;border-radius:4px}
#out p{margin:.9em 0}
.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:.85rem;margin:14px 0 0}
.link{background:none;color:var(--pen);padding:0;font-weight:500;text-decoration:underline}
.err{color:var(--pen)}
@media (max-width:520px){main{padding-left:44px}main::before{left:26px}form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){#out{transition:opacity .2s}}
</style>
</head>
<body>
<main>
  <h1>odev.ai</h1>
  <p class="sub">Kitabı ve sayfayı seç, çözümün mantığını adım adım gör.</p>
  <form id="f">
    <label class="full">Ders kitabı<select id="book" required></select></label>
    <label>Sayfa numarası<input id="page" type="number" min="1" inputmode="numeric" required></label>
    <label>Soru numarası (boşsa tüm sayfa)<input id="q" inputmode="numeric" placeholder="örn. 3"></label>
    <div class="full modes">
      <label><input type="radio" name="mode" value="hint" checked> Önce ipucu ver</label>
      <label><input type="radio" name="mode" value="full"> Tam çözümü göster</label>
    </div>
    <button class="full" id="go">Çözümü getir</button>
  </form>
  <section id="out" hidden aria-live="polite"></section>
  <div class="bar" id="bar" hidden>
    <span id="meta"></span>
    <button type="button" class="link" id="report">Çözüm yanlış görünüyor</button>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
let lastKey=null;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const render=t=>t.split(/\n{2,}/).map(p=>"<p>"+esc(p).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>")+"</p>").join("");
fetch("/api/books").then(r=>r.json()).then(b=>{
  $("#book").innerHTML=b.map(x=>`<option value="${x.id}">${x.ad}</option>`).join("");
});
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();
  const out=$("#out"),go=$("#go");
  go.disabled=true;go.textContent="Çözülüyor…";out.hidden=false;$("#bar").hidden=true;
  out.innerHTML="<p>Sayfa okunuyor, birkaç saniye sürebilir.</p>";
  try{
    const r=await fetch("/api/solve",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({bookId:$("#book").value,page:$("#page").value,question:$("#q").value,
        mode:document.querySelector("input[name=mode]:checked").value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error);
    lastKey=d.key;out.innerHTML=render(d.text);
    $("#meta").textContent=d.cached?"Daha önce çözülmüş sayfa":"Yeni çözüldü";$("#bar").hidden=false;
  }catch(err){out.innerHTML=`<p class="err">${esc(err.message||"Bir hata oluştu.")}</p>`}
  go.disabled=false;go.textContent="Çözümü getir";
});
$("#report").onclick=async()=>{
  await fetch("/api/report",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:lastKey})});
  $("#meta").textContent="İşaretlendi. Bir sonraki istekte yeniden çözülecek.";
};
</script>
</body>
</html>
